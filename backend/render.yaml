services:
  - type: web
    name: venderscope-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    # --proxy-headers: trust X-Forwarded-For from Render's load balancer so
    # request.client.host is the real client IP (rate limits need this).
    # --forwarded-allow-ips="*" remains correct on Render (no stable proxy CIDR list).
    # Docker/HF image uses FORWARDED_ALLOW_IPS env with the same default.
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"

